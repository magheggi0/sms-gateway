<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Accesso · SMS Gateway</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f172a; --card:#1a2436; --border:#263349; --text:#e5e9f0; --muted:#8b96ab; --accent:#38bdf8; --err:#ef4444; }
  * { box-sizing: border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system, Segoe UI, Roboto, sans-serif; margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; }
  form { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:28px; width:100%; max-width:360px; }
  h1 { font-size:1.3rem; margin:0 0 20px; }
  label { display:block; font-size:0.8rem; color:var(--muted); margin-bottom:4px; }
  input { width:100%; background:#0f1626; border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px 12px; font-size:0.95rem; margin-bottom:14px; }
  button { width:100%; background:var(--accent); color:#04202e; border:none; border-radius:8px; padding:10px 18px; font-weight:600; cursor:pointer; }
  .err { color:var(--err); font-size:0.9rem; margin-bottom:14px; }
</style>
</head>
<body>
  <form method="post" action="/login">
    <h1>📡 SMS Gateway</h1>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    {% if not disabled %}
    <label for="username">Utente</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Accedi</button>
    {% endif %}
  </form>
</body>
</html>
